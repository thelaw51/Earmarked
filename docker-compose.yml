# Portainer stack for PodcastBookRecs. Replace the /path/to/... host paths with your own.
#
# Keep /data on local disk (e.g. the LXC's own storage), never on an SMB/NFS share: SQLite's locking
# doesn't work reliably over network filesystems. The podcasts folder can be on the NAS; it's read-only.
#
# Stack environment variables (optional):
#   PBR_TAG   image tag to run. Default "latest". Set to a build tag such as "sha-1a2b3c4" to roll back.
#   PBR_PORT  host port for the UI. Default 8742.
#   PBR_HARDCOVER_TOKEN  Hardcover API token, only if Hardcover is in BookLookup:Fallbacks. Keep it in the stack
#             variables, not in this file or config.json, and uncomment the line under the worker below.

services:
  worker:
    image: ghcr.io/thelaw51/podcastbookrecs:${PBR_TAG:-latest}
    command: ["worker"]
    restart: unless-stopped
    environment:
      TZ: Europe/London
      # Only the Worker searches catalogues. No default on purpose: with Hardcover listed and the variable unset, the
      # Worker refuses to start with "Hardcover:Token is needed" instead of sending an empty token.
      # PBR_Hardcover__Token: ${PBR_HARDCOVER_TOKEN}
    volumes:
      - /path/to/podcastbookrecs/config:/config:ro
      - /path/to/podcastbookrecs/data:/data
      # Audiobookshelf's podcast library, read-only. Not used yet: reusing its downloads instead of fetching audio
      # again is a planned follow-up. Safe to leave in place or remove.
      - /path/to/nas/Podcasts:/podcasts:ro

  web:
    image: ghcr.io/thelaw51/podcastbookrecs:${PBR_TAG:-latest}
    # To pin one build instead of using PBR_TAG, hard-code the tag on both services, e.g.:
    # image: ghcr.io/thelaw51/podcastbookrecs:sha-1a2b3c4
    command: ["web"]
    restart: unless-stopped
    depends_on:
      - worker
    environment:
      TZ: Europe/London
    ports:
      - "${PBR_PORT:-8742}:8080"
    volumes:
      - /path/to/podcastbookrecs/config:/config:ro
      - /path/to/podcastbookrecs/data:/data
